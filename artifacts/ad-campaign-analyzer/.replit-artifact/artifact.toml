kind = "data-app"
previewPath = "/ad-campaign-analyzer/"
title = "Ad Campaign Analyzer"
description = "Upload or download a campaign CSV/Excel template, then explore spend, clicks, conversions, ROI, and channel trends with shared filters and an optional read-only LangChain assistant."
version = "1.0.0"
id = "artifacts/ad-campaign-analyzer"
router = "path"

[[services]]
name = "web"
paths = [ "/ad-campaign-analyzer/" ]
localPort = 26198

[services.development]
run = "pnpm --filter @workspace/ad-campaign-analyzer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ad-campaign-analyzer", "run", "build" ]
serve = "static"
publicDir = "artifacts/ad-campaign-analyzer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26198"
BASE_PATH = "/ad-campaign-analyzer/"
